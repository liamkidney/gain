name: Import Gain MVP
on:
  push:
    branches: [dev]
    paths: ['.bootstrap/ready']
permissions:
  contents: write
  actions: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Restore verified MVP source
        run: |
          cat .bootstrap/part-*.b64 | base64 --decode > /tmp/gain-src.tar.xz
          echo 'bc8bd0829683890959de4346811d5d1c880c7e466a26577d6680e354a2e74d0a  /tmp/gain-src.tar.xz' | sha256sum -c -
          tar -xJf /tmp/gain-src.tar.xz
          python scripts/make-art.py
          npm run check
          npm run build:dev
      - name: Commit on dev only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .bootstrap
          rm .github/workflows/bootstrap.yml
          git add -A
          git commit -m "Implement Gain MVP"
          git push origin HEAD:dev
      - name: Trigger validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run check-dev.yml --ref dev

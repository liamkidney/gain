name: Enable GitHub Pages
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/enable-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Request Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main

name: Promote dev to production
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify dev contains main and passes checks
        run: |
          git fetch origin main dev
          git merge-base --is-ancestor origin/main origin/dev
          npm run check
          npm run build:prod
          npm run build:dev
      - name: Fast-forward production to exactly the validated dev SHA
        run: |
          DEV_SHA=$(git rev-parse origin/dev)
          test "$DEV_SHA" = "$(git rev-parse HEAD)"
          git push origin "$DEV_SHA:refs/heads/main"
          echo "Released $DEV_SHA"
